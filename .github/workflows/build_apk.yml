name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Автоматический перенос файлов в корень, если проект загружен внутри папки XDownloader
      - name: Check and adjust project structure
        run: |
          if [ -d "XDownloader" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Moving files from XDownloader subdirectory to root..."
            shopt -s dotglob
            mv XDownloader/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --stacktrace
          else
            gradle assembleDebug -PversionCode=${{ github.run_number }} --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XDownloader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
